<!DOCTYPE html>
<html lang="en">
<head>

            align-items: center;
            min-height: 100vh;
            margin: 0;

            color: #58a6ff;
            margin-bottom: 8px;
        }
        p {
            font-size: 15px;
            line-height: 1.6;
        }
        .links a {
            display: inline-block;
            margin: 10px 5px;
            padding: 8px 16px;
            color: #ffffff;
            background-color: #238636;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
        }
        .links a:hover {
            background-color: #2ea043;

    <div class="card">
        <h1>Hi, I'm Sakshi! 👋</h1>
